<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>케빈의 정글 탈출기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for clean UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jungle: {
                            800: '#112211',
                            900: '#0a160a',
                            950: '#040d04',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #040d04;
            color: #f0fdf4;
            min-height: 100vh;
            user-select: none;
        }

        .glass-card {
            background: rgba(10, 22, 10, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }

        .photo-banner {
            transition: opacity 0.5s ease-in-out, transform 0.7s ease-out;
        }

        .choice-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(234, 179, 8, 0.6);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }

        .choice-btn:active {
            transform: translateY(1px);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(4, 13, 4, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center justify-center min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950 via-jungle-900 to-black">

    <div class="w-full max-w-2xl glass-card rounded-3xl overflow-hidden flex flex-col my-auto border border-white/10">
        
        <!-- App Header with Realistic Thumbnail Avatar -->
        <header class="bg-black/60 px-5 py-4 border-b border-white/10 flex justify-between items-center gap-3">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-xl overflow-hidden border border-emerald-500/40 shadow-md relative bg-emerald-950">
                    <img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=150&q=80" alt="Jungle Boy Kevin" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black text-emerald-400 tracking-tight flex items-center gap-2">
                        케빈의 정글 탈출기
                    </h1>
                    <p class="text-xs text-stone-400 font-medium">실사 인터랙티브 스토리북</p>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center space-x-2.5">
                <button id="soundToggle" onclick="toggleAudio()" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-stone-300 transition" title="효과음 토글">
                    <i class="fas fa-volume-high text-sm" id="soundIcon"></i>
                </button>
                <button onclick="openInventory()" class="p-2.5 rounded-xl bg-emerald-950 hover:bg-emerald-900 border border-emerald-500/30 text-emerald-300 transition relative" title="가방 보기">
                    <i class="fas fa-briefcase text-sm"></i>
                    <span id="bagCount" class="absolute -top-1.5 -right-1.5 bg-amber-500 text-black font-extrabold text-[10px] w-4 h-4 rounded-full flex items-center justify-center shadow">2</span>
                </button>
            </div>
        </header>

        <main class="p-4 sm:p-6 space-y-5">
            
            <!-- Realistic Scene Photo Display (Location indicator removed) -->
            <div class="relative w-full h-52 sm:h-64 rounded-2xl overflow-hidden bg-black border border-white/10 shadow-2xl group">
                <img id="scenePhoto" src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=1200&q=80" alt="Scene Photo" class="photo-banner w-full h-full object-cover">
                
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                
                <!-- Chapter Badge -->
                <div class="absolute top-3.5 left-3.5 bg-black/70 backdrop-blur-md px-3 py-1 rounded-lg border border-white/15 text-xs font-bold text-amber-400 tracking-wider flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="chapterBadge">CHAPTER 1</span>
                </div>

                <!-- Scene Title overlay (Location display removed as requested) -->
                <div class="absolute bottom-3.5 left-3.5 right-3.5 flex justify-between items-end">
                    <div>
                        <h2 id="sceneTitle" class="text-base sm:text-lg font-bold text-white drop-shadow-md">맹수와의 만남</h2>
                    </div>
                </div>
            </div>

            <!-- Story Narrative Box -->
            <div class="bg-black/50 p-5 rounded-2xl border border-white/10 space-y-3 shadow-inner">
                <div class="flex items-center justify-between pb-2 border-b border-white/5">
                    <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fas fa-book-open text-amber-400"></i> 상황 개요
                    </span>
                    <span id="stepIndicator" class="text-[11px] text-stone-400 font-medium">단계 1 / 3</span>
                </div>
                <p id="storyContent" class="text-sm sm:text-base text-stone-100 leading-relaxed font-normal min-h-[70px]">
                    <!-- Narrative populated by JS -->
                </p>
            </div>

            <div class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <span class="text-xs font-bold text-stone-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fas fa-hand-pointer text-emerald-400"></i> 케빈의 선택
                    </span>
                </div>

                <div id="choicesGrid" class="grid grid-cols-1 gap-2.5">
                    <!-- Choice Buttons rendered dynamically -->
                </div>
            </div>
        </main>

        <footer class="bg-black/60 px-6 py-3 border-t border-white/10 flex justify-between items-center text-xs text-stone-400">
            <button onclick="resetGame()" class="hover:text-emerald-300 flex items-center gap-1.5 transition">
                <i class="fas fa-rotate-right"></i> 처음부터 다시하기
            </button>
            <span class="text-[11px] text-stone-500">Kevin Jungle Escape</span>
        </footer>
    </div>

    <!-- Inventory Modal -->
    <div id="inventoryModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-stone-900 border border-white/15 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
            <button onclick="closeInventory()" class="absolute top-4 right-4 text-stone-400 hover:text-white transition">
                <i class="fas fa-xmark text-lg"></i>
            </button>
            <h3 class="text-lg font-bold text-white mb-1 flex items-center gap-2">
                <i class="fas fa-briefcase text-emerald-400"></i> 소지품 가방
            </h3>
            <p class="text-xs text-stone-400 mb-4">케빈이 지니고 있는 실제 물품들입니다.</p>
            
            <div class="space-y-3">
                <!-- Duck Tube Item -->
                <div class="p-3 rounded-xl bg-black/50 border border-white/10 flex items-center gap-3">
                    <div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0 border border-amber-500/30">
                        <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=200&q=80" alt="Duck Tube" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-amber-300">노란 오리 튜브</h4>
                        <p class="text-[11px] text-stone-400 mt-0.5">워터파크에서 챙겨온 공기 주입식 튜브.</p>
                    </div>
                </div>

                <!-- Mysterious Note Item -->
                <div class="p-3 rounded-xl bg-black/50 border border-white/10 flex items-center gap-3">
                    <div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0 border border-emerald-500/30">
                        <img src="https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=200&q=80" alt="Mysterious Note" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-emerald-300">의문의 종이</h4>
                        <p class="text-[11px] text-stone-400 mt-0.5">워터파크 시설 이용 규칙이 적힌 종이.</p>
                    </div>
                </div>
            </div>

            <div class="mt-5 text-center">
                <button onclick="closeInventory()" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // High-Definition Realistic Scene and Choice Thumbnail Photos
        const IMAGES = {
            chap1_main: 'https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=1200&q=80',
            chap2_main: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80',
            chap3_main: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80',
            happy_ending: 'https://images.unsplash.com/photo-1582650625119-3a31f8fa2699?auto=format&fit=crop&w=1200&q=80',
            game_over: 'https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=1200&q=80',
            
            // Choice Thumbnails
            gun: 'https://images.unsplash.com/photo-1595590424283-b8f17842773f?auto=format&fit=crop&w=150&q=80',
            pet: 'https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=150&q=80',
            run: 'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?auto=format&fit=crop&w=150&q=80',
            dodge: 'https://images.unsplash.com/photo-1517649763962-0c623266ddc0?auto=format&fit=crop&w=150&q=80',
            
            path: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=150&q=80',
            duck: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=150&q=80',
            bridge: 'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=150&q=80',
            swim: 'https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=150&q=80',

            plant_tube: 'https://images.unsplash.com/photo-1508873696983-2df515122519?auto=format&fit=crop&w=150&q=80',
            headbutt: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=150&q=80',
            note: 'https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=150&q=80',
            surf: 'https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=150&q=80'
        };

        class SimpleAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playClick() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playWin() {
                if (this.muted) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.12);
                    osc.stop(this.ctx.currentTime + idx * 0.12 + 0.3);
                });
            }
            playFail() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const audio = new SimpleAudio();

        function toggleAudio() {
            audio.muted = !audio.muted;
            const icon = document.getElementById('soundIcon');
            if (audio.muted) {
                icon.className = 'fas fa-volume-xmark text-sm text-red-400';
            } else {
                icon.className = 'fas fa-volume-high text-sm text-emerald-400';
                audio.playClick();
            }
        }

        let currentChapter = 1;

        const STORY_DATA = {
            1: {
                badge: 'CHAPTER 1',
                title: '맹수와의 만남',
                photo: IMAGES.chap1_main,
                step: '단계 1 / 3',
                narrative: '워터파크 인공지능 오작동으로 깊은 정글 속에 홀로 떨어진 케빈! 정신을 차려보니 눈앞에 거대한 흑곰과 갈기가 무성한 사자가 나란히 길을 막아서서 케빈을 무섭게 노려보고 있습니다.',
                choices: [
                    {
                        text: '1. 총으로 쏴버린다.',
                        thumb: IMAGES.gun,
                        action: () => triggerGameOver('총이 불발되었습니다! 맹수들이 놀라 케빈에게 달려듭니다.')
                    },
                    {
                        text: '2. 쓰다듬어준다.',
                        thumb: IMAGES.pet,
                        action: () => advanceChapter(2)
                    },
                    {
                        text: '3. 도망간다.',
                        thumb: IMAGES.run,
                        action: () => triggerGameOver('사자가 케빈을 번쩍 들어 올리고 곰이 드롭킥을 날렸습니다!')
                    },
                    {
                        text: '4. 무빙으로 피한다.',
                        thumb: IMAGES.dodge,
                        action: () => triggerGameOver('사자의 날카로운 몸통 바위치기에 덮쳐졌습니다!')
                    }
                ]
            },
            2: {
                badge: 'CHAPTER 2',
                title: '거센 계곡 하류',
                photo: IMAGES.chap2_main,
                step: '단계 2 / 3',
                narrative: '맹수들을 친절하게 쓰다듬어 준 덕분에 무사히 계곡 하류에 도착한 케빈! 하지만 눈앞에는 거센 물살이 몰아치고 사나운 악어들이 도사리는 계곡이 막아서고 있습니다.',
                choices: [
                    {
                        text: '1. 오솔길으로 들어간다.',
                        thumb: IMAGES.path,
                        action: () => triggerGameOver('오솔길에 있던 고릴라들에게 샌드백처럼 맞아 기절했습니다!')
                    },
                    {
                        text: '2. 오리튜브를 타고 건너간다.',
                        thumb: IMAGES.duck,
                        action: () => triggerGameOver('악어가 오리튜브를 진짜 오리로 착각하고 360도 물어뜯어버렸습니다!')
                    },
                    {
                        text: '3. 목선 조각을 조립해 다리를 만든다.',
                        thumb: IMAGES.bridge,
                        action: () => triggerGameOver('밤새가며 다리를 다 만들었는데 악어가 1초 만에 물어뜯어 파괴해버려서 극심한 스트레스로 사망했습니다!')
                    },
                    {
                        text: '4. 수영해서 건넌다.',
                        thumb: IMAGES.swim,
                        action: () => advanceChapter(3)
                    }
                ]
            },
            3: {
                badge: 'CHAPTER 3 (최종장)',
                title: '고대 유적지 탈출구',
                photo: IMAGES.chap3_main,
                step: '단계 3 / 3',
                narrative: '수영으로 계곡을 무사히 건너온 케빈! 마침내 정글을 빠져나갈 워터파크 미끄럼틀을 발견했지만, 뒤에서는 거대한 바위가 굴러오고 앞에서는 무시무시한 식인 식물이 입구를 가로막고 있습니다!',
                choices: [
                    {
                        text: '1. 오리 튜브를 식인 식물 입에 집어넣어 입을 막아버리고 틈새로 뛰어든다.',
                        thumb: IMAGES.plant_tube,
                        action: () => triggerHappyEnding()
                    },
                    {
                        text: '2. 수경을 쓸어올리고 굴러오는 거대 바위에 헤딩을 날린다.',
                        thumb: IMAGES.headbutt,
                        action: () => triggerGameOver('거대한 돌바위는 너무 단단했습니다... 머리에 별이 반짝입니다.')
                    },
                    {
                        text: '3. 의문의 종이를 식인 식물에게 보여주며 무단 점유라고 항의한다.',
                        thumb: IMAGES.note,
                        action: () => triggerGameOver('식인 식물이 종이와 함께 케빈을 한 입에 삼켜버렸습니다!')
                    },
                    {
                        text: '4. 굴러오는 바위 위로 뛰어올라 서핑하듯 바위를 타고 식물을 들이받는다.',
                        thumb: IMAGES.surf,
                        action: () => triggerGameOver('이끼 낀 바위 위에서 발이 미끄러져 굴러떨어졌습니다!')
                    }
                ]
            }
        };

        function renderScene() {
            const data = STORY_DATA[currentChapter];
            
            // Photo & Badges update
            const img = document.getElementById('scenePhoto');
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = data.photo;
                img.style.opacity = '1';
            }, 150);

            document.getElementById('chapterBadge').innerText = data.badge;
            document.getElementById('sceneTitle').innerText = data.title;
            document.getElementById('stepIndicator').innerText = data.step;
            document.getElementById('storyContent').innerText = data.narrative;

            // Render Choice Buttons
            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = '';

            data.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn w-full p-3 rounded-xl bg-black/60 border border-white/10 hover:bg-emerald-950/80 flex items-center gap-3.5 text-left transition';
                btn.onclick = () => {
                    audio.playClick();
                    c.action();
                };

                btn.innerHTML = `
                    <div class="w-11 h-11 rounded-lg overflow-hidden flex-shrink-0 border border-white/15 bg-black">
                        <img src="${c.thumb}" alt="Choice Thumbnail" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs sm:text-sm font-semibold text-stone-200 leading-snug flex-1">${c.text}</span>
                    <i class="fas fa-chevron-right text-xs text-stone-500"></i>
                `;
                grid.appendChild(btn);
            });
        }

        function advanceChapter(nextChap) {
            currentChapter = nextChap;
            renderScene();
        }

        function triggerGameOver(reason) {
            audio.playFail();
            
            const img = document.getElementById('scenePhoto');
            img.src = IMAGES.game_over;
            
            document.getElementById('chapterBadge').innerText = 'GAME OVER';
            document.getElementById('sceneTitle').innerText = '탈출 실패!';
            document.getElementById('storyContent').innerText = `${reason}\n\n케빈은 정글에서 탈출하지 못했습니다.`;

            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = `
                <button onclick="resetGame()" class="w-full py-3.5 px-4 rounded-xl bg-red-900/80 hover:bg-red-800 border border-red-500/40 text-white font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-rotate-right"></i> 다시 도전하기
                </button>
            `;
        }

        function triggerHappyEnding() {
            audio.playWin();

            const img = document.getElementById('scenePhoto');
            img.src = IMAGES.happy_ending;

            document.getElementById('chapterBadge').innerText = 'SUCCESS';
            document.getElementById('sceneTitle').innerText = '탈출 성공! 🎉';
            document.getElementById('storyContent').innerText = '오리 튜브가 식인 식물의 입 안에서 "팡!" 하고 시원하게 터지면서 식물이 기절했습니다!\n\n케빈은 틈새를 통해 탈출용 워터파크 미끄럼틀로 몸을 날려 시원한 워터파크로 무사히 탈출에 성공했습니다!';

            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = `
                <button onclick="resetGame()" class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs sm:text-sm transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-trophy"></i> 케빈과 함께 처음부터 다시하기
                </button>
            `;
        }

        function resetGame() {
            audio.playClick();
            currentChapter = 1;
            renderScene();
        }

        function openInventory() {
            audio.playClick();
            document.getElementById('inventoryModal').classList.remove('hidden');
            document.getElementById('inventoryModal').classList.add('flex');
        }

        function closeInventory() {
            audio.playClick();
            document.getElementById('inventoryModal').classList.add('hidden');
            document.getElementById('inventoryModal').classList.remove('flex');
        }

        // Initialize on Load
        window.onload = function() {
            renderScene();
        };
    </script>
</body>
</html>
